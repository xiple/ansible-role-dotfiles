---
- name: Manage dotfiles backup
  when: dotfiles_manage_backup
  block:
    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ dotfiles_backup_dir }}"
        state: directory
        mode: "0700"
      register: backup_dir_file

    - name: Check which dotfiles actually exist
      ansible.builtin.stat:
        path: "~/{{ item }}"
      loop: "{{ dotfiles_to_backup }}"
      register: dotfile_stats

    - name: Copy existing dotfiles to backup directory
      ansible.builtin.copy:
        src: "{{ item.stat.path }}"
        dest: "{{ dotfiles_backup_dir }}/{{ item.item }}"
        remote_src: true
        mode: preserve
      loop: "{{ dotfile_stats.results }}"
      when:
        - item.stat.exists
        - backup_dir_file.changed
      loop_control:
        label: "{{ item.item }}"

- name: Install packages for dotfiles configuration.
  ansible.builtin.package:
    name: "{{ dotfiles_packages }}"
    state: "{{ dotfiles_packages_state }}"
  become: true

- name: Clone dotfiles repository.
  ansible.builtin.git:
    repo: "{{ dotfiles_repo_url }}"
    dest: "{{ dotfiles_repo_local_destination }}"
    version: "{{ dotfiles_repo_version }}"

- name: Use stow to install dotfiles (with --adopt flag).
  ansible.builtin.command:
    cmd: stow --adopt .
    chdir: "{{ dotfiles_repo_local_destination }}"
  changed_when: false

- name: Reset local repository.
  ansible.builtin.git:
    repo: "{{ dotfiles_repo_url }}"
    dest: "{{ dotfiles_repo_local_destination }}"
    version: "{{ dotfiles_repo_version }}"
    force: true
